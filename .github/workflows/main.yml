name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Android SDK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip git

      - name: Install Flutter SDK (Manually)
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$HOME/flutter" >> $GITHUB_ENV

      - name: Install Flet
        run: |
          pip install flet

      - name: Build APK
        run: |
          # On s'assure que Flutter est bien initialisé
          $HOME/flutter/bin/flutter doctor
          
          # Lancement du build Flet
          flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk

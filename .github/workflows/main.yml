name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Java (Requis pour compiler du Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          pip install flet

      - name: Create Flutter Project & Build
        run: |
          # 1. Génération du template Flutter propre à Flet
          flet build template
          
          # 2. Copie de ton code Python dans le dossier de build créé par Flet
          mkdir -p build/apk
          cp main.py build/apk/
          
          # 3. Entrer dans le dossier généré
          # Flet crée généralement un dossier temporaire ou un dossier build. 
          # On laisse Flutter compiler directement via la commande standard de build de Flet mais restreinte.
          flutter pub get
          
          # 4. Compilation directe par Flutter
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip git
          pip install flet

      - name: Download Flutter and Build APK
        run: |
          # 1. Téléchargement de Flutter dans le dossier courant
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $GITHUB_WORKSPACE/flutter
          
          # 2. Ajout STRICT de Flutter au PATH pour cette session de terminal
          export PATH="$GITHUB_WORKSPACE/flutter/bin:$PATH"
          export FLUTTER_ROOT="$GITHUB_WORKSPACE/flutter"
          
          # 3. Vérification que la commande 'flutter' répond bien
          flutter --version
          
          # 4. Compilation de l'APK
          flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk

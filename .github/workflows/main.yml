name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          pip install flet

      - name: Check Files & Build APK
        run: |
          # 1. Affiche la liste des fichiers pour voir où est le main.py
          echo "=== Contenu du dépôt ==="
          ls -la
          
          # 2. Lancement du build en spécifiant explicitement le point d'entrée
          flet build apk --yes --skip-flutter-doctor --module-name main
        env:
          CI: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
